<!doctype html>
<html lang="zh-Hant" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MdViewer</title>
<style>/*THEMES*/</style>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="zoom.css">
</head>
<body>
<header class="topbar">
  <div class="group">
    <button id="back" class="icon" data-key="back" disabled></button>
    <button id="forward" class="icon" data-key="forward" disabled></button>
    <button id="reload" class="icon" data-key="reload"></button>
    <button id="history" class="icon" data-key="history"></button>
  </div>
  <nav id="crumbs" class="crumbs" aria-label="目前位置"></nav>
  <button id="search" class="search-pill" data-key="palette">
    <span class="ico" id="search-ico"></span><span class="label">搜尋檔案或貼上路徑</span><kbd data-keys="palette"></kbd>
  </button>
  <div class="group zoom" role="group" aria-label="文字大小">
    <button id="zoom-out" class="icon txt" data-key="zoomOut">A−</button>
    <button id="zoom-reset" class="pct" data-key="zoomReset">100%</button>
    <button id="zoom-in" class="icon txt" data-key="zoomIn">A+</button>
  </div>
  <div class="group">
    <button id="toggle-side" class="icon" data-key="side"></button>
    <button id="toggle-toc" class="icon" data-key="toc"></button>
    <button id="toggle-zen" class="icon" data-key="zen"></button>
    <span class="divider"></span>
    <button id="dark" class="icon"></button>
    <button id="theme" class="icon" title="主題"></button>
    <button id="more" class="icon" title="更多"></button>
  </div>
</header>

<aside class="side" id="side" aria-label="檔案">
  <div class="side-head">
    <div class="proj"><span id="proj-name"></span><span id="proj-path"></span></div>
    <button id="change-root" class="icon sm" data-key="openFolder"></button>
  </div>
  <div class="filter">
    <input id="filter" placeholder="篩選檔案" spellcheck="false" autocomplete="off">
    <div class="kinds" id="kinds" role="group" aria-label="顯示類型">
      <button data-kind="all">全部</button><button data-kind="doc">文件</button><button data-kind="image">圖片</button>
    </div>
  </div>
  <div class="tree" id="tree" role="tree"></div>
</aside>
<div class="resizer" id="resizer" title="拖曳調整寬度，雙擊恢復"></div>

<main class="doc">
  <div class="tabs" id="tabs" role="tablist" hidden></div>
  <iframe id="frame" title="文件內容"></iframe>
  <div class="findbar" id="findbar" role="search" hidden>
    <input id="find-input" placeholder="在本篇中尋找" spellcheck="false" autocomplete="off">
    <span class="count" id="find-count"></span>
    <button id="find-prev" class="icon sm" data-key="findUp"></button>
    <button id="find-next" class="icon sm" data-key="findDown"></button>
    <button id="find-close" class="icon sm" data-key="close"></button>
  </div>
  <div class="empty" id="empty" hidden>
    <h2>選一份文件開始閱讀</h2>
    <p>從左側檔案清單點選，或用快速開啟搜尋檔名、直接貼上路徑。</p>
    <div class="acts">
      <button class="btn primary" id="empty-search">快速開啟 <kbd data-keys="palette"></kbd></button>
      <button class="btn" id="empty-folder">開啟資料夾…</button>
    </div>
  </div>
</main>

<div class="resizer" id="resizer-toc" title="拖曳調整寬度，雙擊恢復"></div>
<aside class="toc" id="toc" aria-label="本篇大綱">
  <div class="toc-head">本篇大綱</div>
  <ol id="toc-list"></ol>
</aside>

<div class="hot left" id="hot-left"></div>
<div class="hot right" id="hot-right"></div>
<div class="hot top" id="hot-top"></div>

<div class="palette" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-label="快速開啟">
    <input id="palette-input" spellcheck="false" autocomplete="off" placeholder="輸入檔名搜尋、貼上路徑，或用 # 跳到本篇標題">
    <ul id="palette-list" role="listbox"></ul>
    <div class="palette-foot" id="palette-foot"></div>
  </div>
</div>
<div class="menu" id="theme-menu" hidden></div>
<div class="menu" id="more-menu" hidden></div>
<div class="menu" id="history-menu" hidden></div>
<div class="lightbox" id="lightbox" role="dialog" aria-label="圖片檢視" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="help" id="help" role="dialog" aria-label="快捷鍵與功能" hidden>
  <div class="help-box">
    <div class="help-head"><h2>快捷鍵與功能</h2><button class="icon sm" data-key="close">✕</button></div>
    <div class="help-body" id="help-body"></div>
  </div>
</div>
<div class="help" id="clipset" role="dialog" aria-label="剪貼簿設定" hidden>
  <div class="help-box clipset-box">
    <div class="help-head"><h2>剪貼簿設定</h2><button class="icon sm" data-key="close">✕</button></div>
    <form class="clipset-body" id="clipset-form">
      <fieldset>
        <legend>複製到 .md 或圖片的路徑時</legend>
        <span id="clip-modes"></span>
      </fieldset>
      <fieldset>
        <legend>路徑夾在其他文字裡時</legend>
        <label>路徑以外最多<input type="number" name="chars" min="0" step="1">個字才自動開啟</label>
        <p class="note">超過只提示，不換頁。0 表示只有複製純路徑才自動開啟；空白、引號、括號不算。</p>
      </fieldset>
      <fieldset>
        <legend>一次複製到多個檔案時</legend>
        <span id="clip-multi"></span>
        <label>最多列出<input type="number" name="max" step="1">個</label>
        <p class="note">「開第一個」找到第一個就停，按「列出」時才找其他的。</p>
      </fieldset>
    </form>
  </div>
</div>
<div class="drop" id="drop" hidden><div class="drop-box">放開以開啟檔案或資料夾</div></div>

<script>/*CONFIG*/</script>
<script src="hljs.min.js"></script>
<script src="zoom.js"></script>
<script src="app.js"></script>
</body>
</html>
